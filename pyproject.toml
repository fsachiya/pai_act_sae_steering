[project]
name = "pai-steer"
version = "0.1.0"
description = "SAE steering of an ACT policy on a color cube sorting task (robosuite)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "robosuite==1.5.*",
    "mujoco==3.3.*",
    "torch",
    "numpy",
    "h5py",
    "matplotlib",
    "pyyaml",
    "tqdm",
    "imageio",
    "imageio-ffmpeg",
    "pandas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pai_steer"]
